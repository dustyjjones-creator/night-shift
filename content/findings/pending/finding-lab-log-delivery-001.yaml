title: A forwarder cursor is a reliability control, not just a convenience
summary: >
  A reliable forwarding workflow advances its position only after downstream
  acknowledgement, so transient delivery failures are retried rather than
  becoming silent data gaps.
why_it_matters: >
  Observability is only useful when the data path makes loss visible and
  recoverable. Acknowledgement-aware state protects the evidence needed for
  troubleshooting and detection.
educational_value: >
  Explains at-least-once delivery, idempotent downstream handling, and why
  offset management belongs in an observability design.
technical_concepts:
  - at_least_once_delivery
  - acknowledgement
  - cursor_management
  - observability
