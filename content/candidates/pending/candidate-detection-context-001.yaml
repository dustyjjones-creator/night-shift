content_type: educational
working_title: A detection threshold is the beginning of the investigation
proposed_hook: >
  Ten failed logins may be noise, a misconfigured client, or the first clue of
  an access problem. The count alone cannot tell you which.
draft: >
  A useful detection does more than cross a threshold: it creates a testable
  question. For authentication failures, I would compare the failure pattern
  with successful logins, whether activity is concentrated, and whether a known
  change explains it. That turns a noisy count into an investigation path. The
  lesson is not to ignore thresholds; it is to design the context that lets a
  responder decide what the threshold means.
target_educational_value: >
  Teach the distinction between telemetry, a detection hypothesis, and a
  validated security conclusion.
